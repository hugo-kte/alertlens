[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alertlens"
version = "0.1.0"
description = "LLM-assisted SOC alert triage: correlation, enrichment, playbook-grounded recommendations, evaluated against ground truth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hugo" }]
keywords = ["soc", "alert-triage", "llm", "incident-response", "mitre-attack", "ollama"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.17.0"]

[project.scripts]
alertlens = "alertlens.cli:app"

[project.urls]
Repository = "https://github.com/hugo-kte/alertlens"

[tool.hatch.build.targets.wheel]
packages = ["src/alertlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.coverage.run]
source = ["alertlens"]
